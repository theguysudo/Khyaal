; Khayaal ESP32 Wi-Fi CSI room sensor
;
; Target: original ESP32-WROOM-32 dev board (2.4 GHz Wi-Fi is required —
; CSI is only available on 2.4 GHz radios).
;
; Build:   pio run            (from this directory)
; Upload:  pio run -t upload  (erase first on a fresh board: see ../mac-setup.md)
; Monitor: pio device monitor (115200 baud; type `help` for the serial CLI)
;
; The firmware uses the Arduino framework for Wi-Fi/HTTP/Serial, and calls the
; underlying ESP-IDF Wi-Fi CSI API directly (esp_wifi_set_csi*). This is the
; same pipeline Espressif's esp-csi project uses; the amplitude-variance
; processing is ported in src/csi_sensor.cpp.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; The Bluetooth Classic stack (Bluedroid) adds ~750 kB of flash, which does
; not fit the Arduino default partition table (1.25 MB app). huge_app.csv
; gives the app 3 MB. nvs and otadata keep their offsets, so the stored
; configuration survives a reflash without erasing the board.
board_build.partitions = huge_app.csv
build_flags =
    -Wall
    -Wextra
