name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Engine tests + web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck shared + engine
        run: |
          npm run typecheck --workspace @khayaal/shared
          npm run typecheck --workspace @khayaal/engine

      - name: Engine unit tests (25 scenarios)
        run: npm test

      - name: Build web app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept licenses and install SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
        working-directory: apps/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: khayaal-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
